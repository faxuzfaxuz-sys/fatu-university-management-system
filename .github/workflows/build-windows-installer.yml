name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Build vaqtida modul darajasidagi tekshiruvlardan o'tish uchungina;
          # haqiqiy ulanish build jarayonida qilinmaydi.
          DATABASE_URL: postgres://user:pass@localhost:5432/fatu
          JWT_SECRET: ci-build-placeholder-not-used

      - name: Prepare runtime node_modules
        shell: bash
        run: |
          mkdir -p runtime_node_modules
          cp package.json package-lock.json runtime_node_modules/
          cd runtime_node_modules
          npm ci --omit=dev

      - name: Build installer (electron-builder)
        run: npx electron-builder --win nsis --x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FATU-University-Portal-Setup
          path: release/*.exe
